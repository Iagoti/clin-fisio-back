# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# As migrations em db/migration usam sintaxe específica do PostgreSQL (OID, IDENTITY
# no estilo Postgres), incompatível com H2 — Flyway fica desligado no perfil de teste,
# que continua dependendo só do ddl-auto=create-drop do Hibernate.
spring.flyway.enabled=false

# JWT Security Configuration
security.jwt.secret=test-secret-key-for-testing-purposes-only-this-is-a-test-key
security.jwt.expiration-minutes=60



